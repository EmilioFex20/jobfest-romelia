version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - env | grep -e COGNITO_REGION -e COGNITO_CLIENT_ID -e COGNITO_CLIENT_SECRET -e API_BASE_URL >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
          - .next/cache/**/*