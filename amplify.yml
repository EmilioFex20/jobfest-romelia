version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - echo "COGNITO_REGION=$COGNITO_REGION" >> .env.production
            - echo "COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID" >> .env.production
            - echo "COGNITO_CLIENT_SECRET=$COGNITO_CLIENT_SECRET" >> .env.production
            - echo "API_BASE_URL=$API_BASE_URL" >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
          - .next/cache/**/*